name: CI

on:
  push:
    branches: ["**"]        # 分支开发也要跑：不能因为"还没开 PR"让闸门空转
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 北京 02:00
  workflow_dispatch:

# rule: CI-GAT-004 —— 同 ref 的新推送取消旧运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # rule: CI-GAT-001 —— L1 闸门预算 3 分钟
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - name: fast gates (docs + registry + code)
        run: python scripts/ci/run_ci.py --mode fast
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: build/ci-reports/
          if-no-files-found: warn
          retention-days: 30

  # rule: CI-COD-002 —— 警告即错误；Linux 双编译器
  # rule: CI-COD-005 —— 未使用符号/参数由 -Wunused 与 clang-tidy 同时拦截
  # L2：构建 + 按注册表跑 fast 测试（合并了原先重复全量构建的 registered-tests 作业）
  build:
    name: build-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -Wno-error=#warnings：doctest 2.4.11 在 clang 下无条件带 <ciso646>，libstdc++ 15 对该头抛
      # #warning；只把它降级为告警，其余类别仍是 -Werror。
      - name: configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror ${{ matrix.compiler == 'clang' && '-Wno-error=#warnings' || '' }}"
      - name: build
        run: cmake --build build --parallel
      - name: clang-tidy
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y -qq clang-tidy
          # runner_llama.cpp 只在 LLMOPT_ENABLE_LLAMA=ON 下可编译，默认构建没有 llama.h；
          # 它的可编译性由 llama-compile 作业单独守着，这里不重复扫。
          files=$(find src include \( -name '*.cc' -o -name '*.cpp' \) | grep -v 'src/runner_llama.cpp' | head -50)
          if [ -z "$files" ]; then
            echo "SKIP(clang-tidy): 暂无 C++ 源文件" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          clang-tidy -p build $files
      - name: registered fast tests
        run: python scripts/ci/run_registry.py --speed fast --junit-dir build/ci-reports/junit
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.compiler }}
          path: build/ci-reports/
          if-no-files-found: warn
          retention-days: 30

  # rule: CI-MEM-001 —— ASan + UBSan
  # rule: CI-MEM-002 —— TSan 单独作业，与 ASan 互斥
  # 用 --build-dir 指向本次作业真正构建出来的目录，避免注册表里的 build/ 落空
  sanitizers:
    name: san-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -g
          - name: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer -g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -Wno-error=maybe-uninitialized：RelWithDebInfo + ASan 下 GCC 对 libstdc++ <regex>
      # 的 std::_StateT 报假阳性；只降级该类，告警仍打印。
      - name: configure
        env:
          CXXFLAGS: ${{ matrix.flags }}
        run: |
          cmake -S . -B build-san-${{ matrix.name }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }} -Wno-error=maybe-uninitialized"
      - name: build
        run: cmake --build build-san-${{ matrix.name }} --parallel
      - name: fast tests under sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >
          python scripts/ci/run_registry.py --speed fast
          --build-dir build-san-${{ matrix.name }}

  # rule: CI-COV-001 / CI-COV-002 —— 行覆盖与增量覆盖，两者都卡阈值
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install gcovr
        run: python -m pip install --upgrade pip gcovr
      - name: configure with gcov
        run: >
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug
          -DLLMOPT_COVERAGE=ON
      - name: build
        run: cmake --build build-cov --parallel
      - name: run fast tests
        run: python scripts/ci/run_registry.py --speed fast
             --build-dir build-cov --junit-dir build/ci-reports/junit
      - name: coverage gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
            BASE="origin/$BASE_REF"
          fi
          python scripts/ci/check_coverage.py --build-dir build-cov --base "$BASE"
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/ci-reports/
          if-no-files-found: warn
          retention-days: 30

  # rule: CI-TLS-001 —— TLS 是可选构建；至少一个 Linux 作业编译并跑握手/隔离回归
  tls:
    name: tls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
      - name: configure
        run: >
          cmake -S . -B build-tls -DCMAKE_BUILD_TYPE=Release
          -DLLMOPT_ENABLE_TLS=ON
      - name: build
        run: cmake --build build-tls --parallel
      - name: TLS and control isolation
        run: >
          ctest --test-dir build-tls --output-on-failure
          -R "integration_server_tls|integration_server_control_isolation|integration_server_tls_config_error"

  # rule: CI-LLM-001 —— 真实后端不进默认链接，但必须至少被编译一次
  llama-compile:
    name: llama-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: fetch llama.cpp headers
        run: |
          curl -sSL -o /tmp/llama.tar.gz \
            https://github.com/ggml-org/llama.cpp/archive/refs/tags/b12557.tar.gz
          tar -xzf /tmp/llama.tar.gz -C /tmp
          mv /tmp/llama.cpp-b12557 /tmp/llama
      - name: compile runner_llama.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Wpedantic -Wshadow -O0 -c src/runner_llama.cpp \
            -I include -I third_party/_deps/nlohmann_json-src/include \
            -I third_party/_deps/spdlog-src/include \
            -isystem /tmp/llama/include -isystem /tmp/llama/ggml/include \
            -o /tmp/runner_llama.o
          echo "OK: runner_llama.cpp 编译通过（未链接 llama 库）" >> "$GITHUB_STEP_SUMMARY"

  # rule: CI-PRF-001 —— 吞吐/延迟回退 >5%
  # rule: CI-PRF-002 —— 基准离散度 >8% 作废
  nightly:
    name: nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: build
        run: cmake --build build --parallel
      - name: all registered tests (fast + slow)
        run: python scripts/ci/run_registry.py --speed all --exclude needs-gpu,needs-vm
      - name: perf guard
        run: |
          if python scripts/ci/run_registry.py --speed slow --only perf --dry-run | grep -q "DRY"; then
            python scripts/ci/run_registry.py --speed slow --only perf
          else
            echo "SKIP(perf): 注册表中尚无 perf 基线，数据不足以判定回退" >> "$GITHUB_STEP_SUMMARY"
          fi
